version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Repeated literals in tests (fixture names, labels, etc.) are cosmetic
      # and not worth extracting into constants.
      - linters:
          - goconst
        path: _test\.go
      # Pre-existing deprecations surfaced by the golangci-lint v2.13.2 bump
      # (staticcheck picking up controller-runtime v0.25.0's newly-annotated
      # APIs). Tracked for a dedicated follow-up rather than a drive-by fix
      # here, since each has real behavior/type implications:
      #  - scheme.Builder: cosmetic, but bundled with the others for one ticket.
      #  - GetEventRecorderFor: replacement returns a different recorder type
      #    (recorder.EventRecorder, not record.EventRecorder), touching the
      #    Recorder field, recordEvent() helper, and test fakes.
      #  - ctrl.Result{Requeue: true}: this is the documented IsConflict retry
      #    pattern; swapping to RequeueAfter changes retry timing and
      #    needs its own reviewed change, not a silent rename.
      - linters:
          - staticcheck
        text: scheme\.Builder is deprecated|GetEventRecorderFor is deprecated|\.Result\)\.Requeue is deprecated
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
