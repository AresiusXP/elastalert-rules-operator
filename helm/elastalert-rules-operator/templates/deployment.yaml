apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elastalert-rules-operator.fullname" . }}
  labels:
    {{- include "elastalert-rules-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "elastalert-rules-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "elastalert-rules-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "elastalert-rules-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            {{- $cms := include "elastalert-rules-operator.targetList" (dict "root" . "kind" "ConfigMap") }}
            {{- if $cms }}
            - --allowed-targets={{ $cms }}
            {{- end }}
            {{- $secrets := include "elastalert-rules-operator.targetList" (dict "root" . "kind" "Secret") }}
            {{- if $secrets }}
            - --allowed-secret-targets={{ $secrets }}
            {{- end }}
            - --allowed-alerters={{ join "," .Values.policy.allowedAlerters }}
            {{- if .Values.policy.allowedIndexPatterns }}
            - --allowed-index-patterns={{ join "," .Values.policy.allowedIndexPatterns }}
            {{- end }}
            {{- if .Values.policy.allowedHttpHosts }}
            - --allowed-http-hosts={{ join "," .Values.policy.allowedHttpHosts }}
            {{- end }}
            {{- if .Values.policy.allowedAdditionalFields }}
            - --allowed-additional-fields={{ join "," .Values.policy.allowedAdditionalFields }}
            {{- end }}
            {{- if .Values.secretRefs.enabled }}
            - --enable-secret-refs
            - --secret-resync={{ .Values.secretRefs.resync }}
            {{- end }}
            {{- if .Values.elastalert.enabled }}
            - --elastalert-deployment={{ include "elastalert-rules-operator.rolloutNamespace" . }}/{{ .Values.elastalert.deploymentName }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
