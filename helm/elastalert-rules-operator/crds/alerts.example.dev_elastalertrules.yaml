                  description: |-
                    SecretRef injects the value of a Secret key into a top-level rule field.
                    The Secret must be in the rule namespace and carry the label
                    alerts.example.dev/allow-source=true.
                  properties:
                    field:
                      description: Field is the top-level ElastAlert field to set
                        (e.g. opsgenie_key, http_post_headers)
                      maxLength: 63
                      pattern: ^[a-z][a-z0-9_]*$
                      type: string
                    format:
                      default: string
                      description: 'Format of the value: "string" uses it as is, "yaml"
                        parses it into a structured value'
                      enum:
                      - string
                      - yaml
                      type: string
                    key:
                      description: Key within the Secret
                      maxLength: 253
                      minLength: 1
                      type: string
                    name:
                      description: Name of the Secret
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - field
                  - key
                  - name
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              targetConfigMap:
