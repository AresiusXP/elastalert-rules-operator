                type: object
                x-kubernetes-preserve-unknown-fields: true
              exponential_realert:
                description: ExponentialRealert defines exponential backoff for realerting
                type: object
                x-kubernetes-preserve-unknown-fields: true
              fields:
                description: Fields is the list of fields to monitor (new_term rules)
