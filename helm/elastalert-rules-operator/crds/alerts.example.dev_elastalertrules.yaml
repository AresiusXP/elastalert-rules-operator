                minLength: 1
                type: string
              keyName:
                description: KeyName is the target key name. Defaults to "<namespace>_<name>.yaml"
                maxLength: 253
                pattern: ^[-._a-zA-Z0-9]+\.ya?ml$
                type: string
              match_bucket_filter:
                description: MatchBucketFilter defines the filter for the match bucket
