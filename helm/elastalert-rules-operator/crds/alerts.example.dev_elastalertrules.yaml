                description: TargetConfigMap specifies where to write the rule. It
                  cannot be changed after creation
                properties:
                  kind:
                    default: ConfigMap
                    description: Kind of the target object. Rules that use secretRefs
                      must target a Secret
                    enum:
                    - ConfigMap
                    - Secret
                    type: string
                  name:
                    default: elastalert-rules
                    description: Name of the target object
                    maxLength: 253
                    type: string
                  namespace:
                    description: Namespace of the target object. Defaults to the CR
                      namespace if not specified
                    maxLength: 63
                    type: string
                type: object
                x-kubernetes-validations:
                - message: targetConfigMap is immutable; delete and recreate the rule
                    to move it
                  rule: self == oldSelf
              timeframe:
                description: |-
                  Timeframe is the time window for rule evaluation
                  Can be specified as an object (e.g., {minutes: 5}, {hours: 1}) or string (e.g., "5m", "1h")
                type: object
                x-kubernetes-preserve-unknown-fields: true
              type:
                description: Type is the ElastAlert built-in rule type
                enum:
                - any
                - blacklist
                - whitelist
                - change
                - frequency
                - spike
                - flatline
                - new_term
                - cardinality
                - metric_aggregation
                - spike_aggregation
                - percentage_match
                type: string
            required:
            - index
            - type
            type: object
            x-kubernetes-validations:
            - message: num_events is required for frequency rules
              rule: self.type != 'frequency' || has(self.num_events)
            - message: rules that use secretRefs must set targetConfigMap.kind to
                Secret
              rule: '!has(self.secretRefs) || size(self.secretRefs) == 0 || (has(self.targetConfigMap)
                && has(self.targetConfigMap.kind) && self.targetConfigMap.kind ==
                ''Secret'')'
          status:
