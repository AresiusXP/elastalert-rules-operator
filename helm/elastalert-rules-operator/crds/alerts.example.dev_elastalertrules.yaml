                  AdditionalFields allows specifying any other ElastAlert fields not explicitly defined above.
                  Keys that conflict with spec fields or are blocked by the operator policy are rejected
                type: object
                x-kubernetes-preserve-unknown-fields: true
              alert:
                description: Alert is the list of alerters to use (e.g., ["email"],
                  ["opsgenie"])
                items:
                  type: string
                type: array
              alert_text:
                description: AlertText is the text to include in the alert
                type: string
              alert_text_args:
                description: AlertTextArgs are the fields to use in alert_text formatting
                items:
                  type: string
                type: array
              bucket_interval:
                description: BucketInterval is the time bucket interval for percentage
