# Default values for elastalert-rules-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/aresiusxp/elastalert-rules-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Rollout of the ElastAlert Deployment after rules change. The operator
# patches the pod template annotation alerts.example.dev/rules-checksum.
elastalert:
  enabled: false
  deploymentName: "elastalert"
  # Defaults to the release namespace
  deploymentNamespace: ""

# Objects rules may write to. Rules pointing anywhere else are rejected, and
# RBAC is generated for exactly these objects. They must already exist.
targets:
  - name: elastalert-rules
    kind: ConfigMap
    # Defaults to the release namespace
    namespace: ""

policy:
  # ElastAlert alerters rules may use. post2 renders payloads with an unsandboxed
  # Jinja template, so only add it when every rule author is trusted.
  allowedAlerters:
    - opsgenie
    - post
    - slack
    - msteams
    - email
    - alertmanager
    - debug
  # Extra ElastAlert settings additionalFields and secretRefs may use. The built-in
  # list covers common options; settings that run code stay blocked regardless.
  allowedAdditionalFields: []
  # Glob patterns of indices rules may query; empty allows every index
  allowedIndexPatterns: []
  # Hostnames http_post_url and http_post2_url may use; empty allows every host
  allowedHttpHosts: []

# Lets rules read credentials from Secrets labelled alerts.example.dev/allow-source=true
# in their own namespace. Grants cluster-wide "get" on Secrets.
secretRefs:
  enabled: false
  resync: 5m

nodeSelector: {}

tolerations: []

affinity: {}

# Additional environment variables
env: []

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true

# Metrics are served over HTTPS and protected by TokenReview and SubjectAccessReview
metrics:
  enabled: false
  port: 8443
  service:
    port: 8443
  # Subjects (for example the Prometheus ServiceAccount) allowed to read /metrics
  readerSubjects: []
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
    # The manager serves a self-signed certificate unless --metrics-cert-path is set
    insecureSkipVerify: true

networkPolicy:
  enabled: false
  # Egress to the Kubernetes API server; empty allows TCP 443 and 6443 to any address
  apiServerCIDRs: []
  # Peers allowed to scrape metrics, e.g. [{namespaceSelector: {matchLabels: {name: monitoring}}}]
  metricsFrom: []

# Only useful with more than one replica
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Health probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

extraObjects: []
