# Default values for elastalert-rules-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/aresiusxp/elastalert-rules-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Optional: Configure automatic rollout trigger for ElastAlert deployment
# When configured, the operator will update the deployment's pod template
# annotation when rule checksums change, triggering a rolling update
elastalert:
  # Enable automatic rollout trigger
  enabled: false
  # Name of the ElastAlert deployment to trigger rollout
  deploymentName: "elastalert"
  # Namespace of the ElastAlert deployment
  deploymentNamespace: "monitoring"

# ConfigMap Configuration
# The operator writes ElastAlert rules to ConfigMaps. Each ElastAlertRule CR
# can specify its target ConfigMap using spec.targetConfigMap.name and namespace.
# Default behavior (if not specified in the CR):
#   - ConfigMap name: "elastalert-rules"
#   - Namespace: same as the ElastAlertRule CR
#
# Example ElastAlertRule CR with custom ConfigMap:
#   apiVersion: alerts.example.dev/v1alpha1
#   kind: ElastAlertRule
#   metadata:
#     name: my-rule
#   spec:
#     type: frequency
#     index: "logs-*"
#     targetConfigMap:
#       name: "my-elastalert-rules"      # Optional: defaults to "elastalert-rules"
#       namespace: "monitoring"          # Optional: defaults to rule's namespace

nodeSelector: {}

tolerations: []

affinity: {}

# Additional environment variables
env: []

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true

# Metrics service configuration
metrics:
  enabled: false
  port: 8443

# Health probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

extraObjects: []
